name: Release - macOS ARM64

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

# Sets permissions to allow version tag
permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/') }}

    runs-on: macos-latest
    timeout-minutes: 45

    env:
      CARGO_PROFILE_RELEASE_LTO: true
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: 'true'

    - name: Run ssh-agent
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.MATCH_CERTIFICATES_GIT_ACCESS_TOKEN }}

    - name: Install Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3'
        bundler-cache: true 

    - name: Install keys, certificates and profiles
      env:
        MATCH_CERTIFICATES_GIT_URL: ${{ secrets.MATCH_CERTIFICATES_GIT_URL }}
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      run: bundle exec fastlane ci_install_release_cert_using_api

    - name: Detect Flutter Version
      uses: kuhnroyal/flutter-fvm-config-action@v3

    - name: Setup Flutter
      uses: flutter-actions/setup-flutter@v4
      with:
        channel: stable
        version: ${{ env.FLUTTER_VERSION }}
        cache: true
        cache-sdk: true

    - name: Prepare Flutter SDK
      run: |
        flutter config --no-analytics --no-cli-animations
        flutter precache --macos

    - name: Install minimal Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        targets: aarch64-apple-darwin

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          rust -> ../build/macos/Build/Intermediates.noindex/Pods.build/Release/rust_lib_momento_booth.build/aarch64-apple-darwin
          rust -> target
      
    - name: Setup sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.10

    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@main

    - name: Install cargo-expand, frbc, cargo-bundle-licenses
      env:
        # Without a token, the GitHub API rate limit of the shared runner IP is often exceeded, making binstall build from source
        GITHUB_TOKEN: ${{ github.token }}
      run: cargo binstall cargo-expand@1.0.126 flutter_rust_bridge_codegen@2.13.0 cargo-bundle-licenses@4.2.0 --force -y

    - name: Install build dependencies
      run: |
        brew install pkgconf create-dmg

    - name: Download native dependencies
      run: ./macos/get_native_deps.sh

    - name: Install dependencies
      run: |
        flutter pub get --enforce-lockfile
        flutter gen-l10n
        dart run tool/generate_licenses.dart
        flutter_rust_bridge_codegen generate
        dart run build_runner build
        flutter analyze --no-pub

    # Extract version from branch name
    - name: Extract release version
      id: extract_release_version
      shell: bash
      run: |
        release_version=$(echo ${{ github.event.pull_request.head.ref }} | cut -d/ -f2)
        echo "release_version=$release_version" >> $GITHUB_OUTPUT
        echo "distributor_version=${release_version/-/+}" >> $GITHUB_OUTPUT

    - name: Build project
      run: |
        rm macos/Podfile.lock
        flutter build macos -v --no-pub --dart-define SENTRY_DSN=${{ secrets.SENTRY_DSN }} --dart-define SENTRY_ENVIRONMENT=Production --dart-define SENTRY_RELEASE=${{ steps.extract_release_version.outputs.distributor_version }}

        mkdir -p ci_build/arm64_bundle
        mv build/macos/Build/Products/Release/MomentoBooth.app ci_build/arm64_bundle/

    # The app gets its own ticket before it goes into the dmg: it cannot be stapled afterwards, and without a stapled ticket the copy
    # in /Applications is only accepted by Gatekeeper when the Mac is online.
    - name: Notarize app
      env:
        APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      run: ./macos/ci_notarize.sh ci_build/arm64_bundle/MomentoBooth.app

    - name: Create dmg installer, sign and notarize
      env:
        APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      run: |
        cd ci_build
        create-dmg --volname "MomentoBooth (Apple Silicon) Installer" --hide-extension "MomentoBooth.app" --window-pos 200 120 --window-size 800 400 --app-drop-link 600 185 "MomentoBooth-AppleSilicon.dmg" "arm64_bundle/MomentoBooth.app"

        codesign --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" --timestamp MomentoBooth-AppleSilicon.dmg
        ../macos/ci_notarize.sh MomentoBooth-AppleSilicon.dmg

        mv MomentoBooth-AppleSilicon.dmg MomentoBooth-${{ steps.extract_release_version.outputs.release_version }}-macOS-AppleSilicon.dmg

    # Create GitHub release
    - name: Create GitHub release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        prerelease: true
        replacesArtifacts: true
        omitBodyDuringUpdate: true
        tag: ${{ steps.extract_release_version.outputs.release_version }}
        artifacts: "ci_build/MomentoBooth-${{ steps.extract_release_version.outputs.release_version }}-macOS-AppleSilicon.dmg"
