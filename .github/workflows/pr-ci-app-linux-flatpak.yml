name: PR CI App - Linux Flatpak

on:
  pull_request:
    branches: [ main ]
    paths-ignore: [ documentation/**, .github/workflows/pr-ci-documentation.yml, .github/workflows/deploy-documentation.yml, README.md ]
    types: [opened, synchronize, reopened, ready_for_review]
  # Builds on main fill the flatpak-builder cache (libgphoto2, build tools, Flutter SDK), which pull requests can use, unlike each other's caches.
  push:
    branches: [ main ]
    paths-ignore: [ documentation/**, .github/workflows/pr-ci-documentation.yml, .github/workflows/deploy-documentation.yml, README.md ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ startsWith(github.event.pull_request.head.ref, 'release/') != true && github.event.pull_request.draft != true }}

    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.variant.runner }}
    # Without cache, the build tools and the Rust crates are compiled from scratch
    timeout-minutes: 90

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Write Dart defines
      env:
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      run: printf '{"SENTRY_DSN":"%s","SENTRY_ENVIRONMENT":"Production","SENTRY_RELEASE":"%s"}\n' "$SENTRY_DSN" "$GITHUB_SHA" > linux/packaging/flatpak/dart-defines.json

    - name: Build Flatpak
      uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        manifest-path: linux/packaging/flatpak/io.github.momentobooth.MomentoBooth.yml
        arch: ${{ matrix.variant.arch }}
        bundle: MomentoBooth-Linux-${{ matrix.variant.arch }}.flatpak
        artifact-name: Linux ${{ matrix.variant.arch }} Flatpak
        # Inside build/, which the manifest does not copy into the app sources
        build-dir: build/flatpak
        repo-dir: build/flatpak-repo
