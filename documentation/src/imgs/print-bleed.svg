<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="sans-serif" font-size="13">
  <title>A collage with bleed on borderless media and on media with a border</title>
  <style>svg { fill: #2C2C2A; } @media (prefers-color-scheme: dark) { svg { fill: #E8E6DF; } }</style>
  <text x="160" y="24" text-anchor="middle" font-weight="bold" font-size="14">Borderless</text>
  <text x="500" y="24" text-anchor="middle" font-weight="bold" font-size="14">With a border</text>

  <rect x="60" y="40" width="200" height="280" fill="#ffffff" stroke="#888780"/>
  <rect x="64" y="54" width="192" height="262" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <rect x="74" y="64" width="172" height="242" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="74" y="64" width="172" height="242" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="160" y="180" text-anchor="middle" font-weight="bold" fill="#085041">Collage</text>
  <text x="160" y="198" text-anchor="middle" font-size="12" fill="#085041">fills the viewport</text>

  <rect x="400" y="40" width="200" height="280" fill="#ffffff" stroke="#888780"/>
  <rect x="414" y="54" width="172" height="252" fill="none" stroke="#5F5E5A" stroke-dasharray="2 3"/>
  <rect x="414" y="63" width="172" height="235" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <rect x="423" y="72" width="154" height="217" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="423" y="72" width="154" height="217" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="500" y="176" text-anchor="middle" font-weight="bold" fill="#085041">Collage</text>
  <text x="500" y="194" text-anchor="middle" font-size="12" fill="#085041">and bleed in the viewport</text>

  <text x="160" y="344" text-anchor="middle" font-size="12">The printer cuts at the viewport,</text>
  <text x="160" y="362" text-anchor="middle" font-size="12">and the bleed with it</text>
  <text x="500" y="344" text-anchor="middle" font-size="12">You cut along the collage by hand,</text>
  <text x="500" y="362" text-anchor="middle" font-size="12">and the bleed with it</text>

  <g font-size="12">
    <rect x="40" y="388" width="14" height="14" fill="#ffffff" stroke="#888780"/>
    <text x="62" y="400">Page (media)</text>
    <rect x="200" y="388" width="14" height="14" fill="#ffffff" stroke="#5F5E5A" stroke-dasharray="2 3"/>
    <text x="222" y="400">Viewport (media minus margins)</text>
    <line x1="440" y1="395" x2="462" y2="395" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="470" y="400">Cut line</text>
    <rect x="40" y="412" width="14" height="14" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
    <text x="62" y="424">Bleed (collage padding)</text>
    <rect x="200" y="412" width="14" height="14" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="222" y="424">Collage without padding</text>
  </g>
</svg>
