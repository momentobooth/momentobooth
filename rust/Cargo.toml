[package]
name = "rust_lib_momento_booth"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = { version = "=2.13.0", features = ["chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = "0.4.45"
image = { version = "0.25.10", features = ["rayon"] }
ipp = { version = "7.0.0", default-features = false, features = ["async-client-tls", "log"] }
zune-jpeg = "0.5.15"
jpeg-encoder = "0.7.1"
dlopen = "0.1.8"
noise = "0.9.0"
dashmap = "6.2.1"
turborand = "0.10.1"
pathsep = "0.1.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "fs", "io-util", "time"] }
gphoto2 = "3.4.1"
ahash = "0.8.12"
img-parts = "0.4.0"
little_exif = "0.6.23"
url = "2.5.8"
num-traits = "0.2.19"
num-derive = "0.5.1"
regex = "1.13.1"
log = "0.4.34"
nokhwa = { git = "https://github.com/l1npengtul/nokhwa.git", branch = "0.10", features = ["input-native", "output-threaded"] }
parking_lot = "0.12.5"
susync = "0.2.0"
rustc_version_runtime = "0.3.0"
libc = "0.2.189"
libusb-sys = "0.2.3"
futures = "0.3.34"
kira = { version = "0.12.4", default-features = false, features = ["cpal", "flac", "mp3", "ogg", "pcm", "vorbis", "wav"] }
snafu = "0.9.2"
aes-gcm = "0.10"
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
base64 = "0.23"
getrandom = "0.4"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }

[profile.dev]
opt-level = 3
